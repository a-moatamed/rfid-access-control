# ==========================================
# GitLab CI/CD Pipeline for Embedded C++ Project
# ==========================================
image:
  name: rfid-builder:local
  pull_policy: if-not-present # Use local image for faster builds

stages:
  - lint
  - build
  - test
  - sanitize
  - docs


# ==========================================
# 1. STATIC ANALYSIS
# ==========================================
static_analysis:
  stage: lint
  tags :
    - local-embedded

  script:
    - echo "Running clang-tidy static analysis..."
    - cmake -S . -B build-lint
    - cmake --build build-lint

# ==========================================
# 2. COMPILATION
# ==========================================
compile_project:
  stage: build
  tags :
    - local-embedded

  needs: [static_analysis]
  script: 
    - echo "Compiling cross-architecture libraries..."
    - cmake -S . -B build -DENABLE_COVERAGE=ON
    - cmake --build build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

# ==========================================
# 3. CODE COVERAGE (Issue 2.4)
# ==========================================
coverage_report:
  stage: test
  tags :
    - local-embedded

  needs: [compile_project]
  script: 
    - cd build
    - echo "Generating gcovr report..."
    - make coverage
  artifacts:
    paths:
      - build/coverage/
    expire_in: 1 week

# ==========================================
# 4. DYNAMIC ANALYSIS 
# ==========================================
sanitize_build:
  stage: sanitize
  tags :
    - local-embedded

  needs: [] # Runs in parallel immediately!

  # Caching build artifacts to speed up subsequent runs. This is especially beneficial 
  # for the sanitization stage, which can be time-consuming due to the additional instrumentation.
  # ==========================================
  cache:
    key: cxx-build-cache          # A unique name for this specific zip file
    paths:
      - build-san/_deps/          # Caches downloaded dependencies (like GoogleTest)
      - build-san/CMakeFiles/     # Caches CMake's internal state
    policy: pull-push             # Download the cache at the start, update it at the end
  # ==========================================
  
  script: 
    - echo "Compiling with AddressSanitizer and UndefinedBehaviorSanitizer..."
    - cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Sanitize
    - cmake --build build-san -j 4 # Use multiple cores for faster builds
    - cd build-san
    - ctest --output-on-failure

# ==========================================
# 5. DOCUMENTATION 
# ==========================================
pages:
  stage: docs
  tags :
    - local-embedded

  needs: [] # Runs in parallel immediately!
  script:
    - echo "Generating Doxygen HTML..."
    - cmake -S . -B build-docs
    - cmake --build build-docs --target docs
    - mv build-docs/docs/html public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'